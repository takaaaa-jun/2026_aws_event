services:
  # 1. データベース (MySQL)
  db:
    image: mysql:8.0
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      LANG: C.UTF-8
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. バックエンド (Python / FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # コンテナ内での起動時のカレントディレクトリを /app/backend に指定
    working_dir: /app/backend
    volumes:
      # プロジェクトルートディレクトリをマウント
      - .:/app
      # ルートの .env ファイルをバックエンド側から読み込める位置にマウント
      - .env:/app/backend/.env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PORT: 3306
    depends_on:
      - db

  # 3. フロントエンド (React + TypeScript / Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    # コンテナ内での起動時のカレントディレクトリを /app/frontend に指定
    working_dir: /app/frontend
    volumes:
      # プロジェクトルートディレクトリをマウント
      - .:/app
      # ホスト側の node_modules でコンテナ側が上書きされないように、
      # コンテナ内のフロントエンドの node_modules ディレクトリを匿名ボリュームで保護
      - /app/frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Windows等でホットリロードが正しく動くようにする設定
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  mysql_data:
